# AP Engine — Nginx site (copy to C:\nginx\nginx-1.30.0\conf\conf.d\ap-engine.conf)
# Public:   http://13.207.66.222:2000
# Internal: uvicorn on 127.0.0.1:8200 (Windows service "ap-engine", run by NSSM)
# The app serves both the dashboard pages and the /api endpoints, so
# everything on port 2000 is proxied to it.

server {
    listen       2000;
    # any IP/hostname — port 2000 is used only by the AP Engine, so this works
    # for 13.207.66.222, 3.109.133.35 and a future domain alike
    server_name  _;

    # invoice PDF uploads
    client_max_body_size 25M;

    location / {
        proxy_pass         http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Live SAP calls (post / park / "Reset all demo cases") can take
        # well over Nginx's default 60 s.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
